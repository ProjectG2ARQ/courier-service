services:
  mysqldb:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: courier_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logitrack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  courier-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courier-service
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysqldb:3306/courier_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: "optional:configserver:http://host.docker.internal:8085"
    ports:
      - "8081:8081"
    networks:
      - logitrack-net

networks:
  logitrack-net:
    driver: bridge

volumes:
  mysql_data: