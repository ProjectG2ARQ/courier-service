spring:
  application:
    name: courier-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://localhost:8085"

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      defer-datasource-initialization: true

  jpa:
    defer-datasource-initialization: true
    open-in-view: false